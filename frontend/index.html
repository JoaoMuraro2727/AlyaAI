<!DOCTYPE html><html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alya - Assistente Emocional</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }.chat-container {
  width: 420px;
  background: #1e293b;
  border-radius: 16px;
  padding: 20px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.3);
}

h1 {
  margin-top: 0;
  font-size: 24px;
  text-align: center;
}

#chatBox {
  height: 300px;
  overflow-y: auto;
  background: #334155;
  border-radius: 12px;
  padding: 12px;
  margin-bottom: 12px;
}

.msg {
  margin: 8px 0;
  padding: 10px;
  border-radius: 10px;
  max-width: 80%;
}

.user {
  background: #2563eb;
  margin-left: auto;
  text-align: right;
}

.bot {
  background: #475569;
  margin-right: auto;
}

.input-row {
  display: flex;
  gap: 8px;
}

input {
  flex: 1;
  padding: 12px;
  border-radius: 10px;
  border: none;
  outline: none;
}

button {
  padding: 12px 16px;
  border: none;
  border-radius: 10px;
  background: #22c55e;
  color: white;
  cursor: pointer;
  font-weight: bold;
}

  </style>
</head>
<body>
  <div class="chat-container">
    <h1>Alya 💙</h1>
    <div id="chatBox"></div><div class="input-row">
  <input type="text" id="messageInput" placeholder="Como você está se sentindo?" />
  <button onclick="sendMessage()">Enviar</button>
</div>

  </div>  <script>
    async function sendMessage() {
      const input = document.getElementById('messageInput');
      const chatBox = document.getElementById('chatBox');
      const message = input.value.trim();

      if (!message) return;

      chatBox.innerHTML += `<div class="msg user">${message}</div>`;
      input.value = '';

      try {
        const response = await fetch('http://localhost:3000/chat', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ message })
        });

        const data = await response.json();
        chatBox.innerHTML += `<div class="msg bot">${data.reply}</div>`;
      } catch (error) {
        chatBox.innerHTML += `<div class="msg bot">Erro ao conectar com o backend.</div>`;
      }

      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script></body>
</html>
